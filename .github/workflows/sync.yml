name: Automatic Fork Sync

on:
  schedule:
    # Runs every day at midnight (UTC)
    - cron: '0 0 * * *'
  # Allows you to manually trigger the sync from the Actions tab
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Sync master with upstream
        uses: repo-sync/github-sync@v2
        with:
          source_repo: sefinek/Malicious-IP-Addresses
          source_branch: "main" # Change to "master" if the original repo uses master
          destination_branch: "main" # The branch in your fork you want to sync
          github_token: ${{ secrets.GITHUB_TOKEN }}
