name: Automatic Fork Sync

on:
  schedule:
    # Runs every day at midnight (UTC)
    - cron: '0 0 * * *'
  # Allows you to manually trigger the sync from the Actions tab
  workflow_dispatch: 

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      # Step 1: Fixes the "not a git repository" error by checking out your fork
      - name: Checkout Forked Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # Ensures git history is retrieved properly for the sync
          fetch-depth: 0 

      # Step 2: Syncs your fork with sefinek's upstream repository
      - name: Sync with Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          upstream_sync_repo: sefinek/Malicious-IP-Addresses
          upstream_sync_branch: main
          target_sync_branch: main
          target_repo_token: ${{ secrets.GITHUB_TOKEN }}
          
          # Optional: Set to true if you want to force sync despite merge conflicts
          test_mode: false
